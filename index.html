<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waters Beach Cafe</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>🌊 Waters Beach Cafe 🌴</h1>
  </header>

<main id="cafe-menu">

  <div id="fish">🐟</div>

  <div id="order-summary">
    <h2>Your Order</h2>
    <p>Total: $<span id="total">0.00</span></p>
  </div>

  <section class="menu-section">
    <h2>🐟 Entrees</h2>

    <div class="menu-items food">

      <div class="menu-option" data-price="16">
        Salmon Cakes | $16
      </div>

      <div class="menu-option" data-price="20">
        Lobster Tail | $20
      </div>

      <div class="menu-option" data-price="22">
        Sushi Platter | $22
      </div>

      <div class="menu-option" data-price="20">
        Crab Cakes | $20
      </div>

      <div class="menu-option" data-price="24">
        Crab Legs | $24
      </div>

    </div>
  </section>

  <section class="menu-section">
    <h2>🍹 Refreshers</h2>

    <div class="menu-items drinks">

      <div class="menu-option" data-price="2">
        Cola | $2.00
      </div>

      <div class="menu-option" data-price="2.5">
        Vitamin Juice | $2.50
      </div>

      <div class="menu-option" data-price="3">
        Mango Lemonade | $3.00
      </div>

      <div class="menu-option" data-price="1.5">
        Glacier Water | $1.50
      </div>

    </div>
  </section>

</main>

<script src="script.js" defer></script>

</body>
</html>
